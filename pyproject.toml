[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiobook-porter"
version = "0.1.0"
description = "Audible → ffmpeg → Audiobookshelf pipeline"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1,<9",
  "audible-cli>=0.3.1,<0.4",
]

[project.scripts]
porter = "porter.cli:main"

[tool.setuptools.packages.find]
include = ["porter*"]
